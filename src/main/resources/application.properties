spring.application.name=websit

#資料庫設定
spring.datasource.url=jdbc:mysql://mysql-2b52a406-websit.c.aivencloud.com:25975/defaultdb?sslMode=REQUIRED&serverTimezone=Asia/Taipei&characterEncoding=UTF-8
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}

# JPA 配置
# 自動更新表結構，可根據需要設置為 create, update, validate, none
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8081

# 啟用 HiddenHttpMethodFilter
spring.mvc.hiddenmethod.filter.enabled=true