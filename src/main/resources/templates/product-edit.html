<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>商品管理</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

    <!-- Header -->
    <div th:replace="~{layout/header :: header}"></div>

    <main class="section section-light">

        <div class="container">
            <!--上面：新增 / 編輯商品 -->

            <div class="section-heading">

                <div class="section-label">
                    PRODUCT MANAGEMENT
                </div>

                <h1>商品管理</h1>

                <p>新增或修改商品資料</p>

            </div>

            <!-- 商品表單 -->
            <div class="product-form-box">

                <h2>新增商品</h2>

                <form th:action="@{/products/edit}" method="post" enctype="multipart/form-data">

                    <!-- CSRF -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <!-- 新增 -->
                    <input type="hidden" name="action" value="add">

                    <!-- 商品名稱 -->
                    <div class="product-form-group">

                        <label for="name">商品名稱</label>

                        <input type="text" id="name" name="name" 
                        th:value="${product.name}" required>

                    </div>

                    <!-- 商品分類 -->
                    <div class="product-form-group">

                        <label for="category">商品分類</label>

                        <input type="text" id="category" name="category" 
                        th:value="${product.category}" required>

                    </div>

                    <!-- 價格 -->
                    <div class="product-form-group">

                        <label for="price">價格</label>

                        <input type="number" id="price" name="price" 
                        th:value="${product.price}" min="0" required>

                    </div>

                    <!-- 庫存 -->
                    <div class="product-form-group">

                        <label for="stock">庫存</label>

                        <input type="number" id="stock" name="stock" 
                        th:value="${product.stock}" min="0" required>

                    </div>

                    <!-- 商品介紹 -->
                    <div class="product-form-group">

                        <label for="description">商品介紹</label>

                        <textarea id="description" name="description" rows="5" 
                        th:text="${product.description}">
                        </textarea>

                    </div>

                    <!-- 商品圖片 -->
                    <div class="product-form-group">

                        <label for="imageFile">商品圖片</label>

                        <input type="file" id="imageFile" name="imageFile" accept="image/*">
                    </div>

                    <!-- 按鈕 -->
                    <div class="product-form-actions">

                        <button type="submit" class="btn btn-primary" 
                        th:text="${product.id == null ? '新增商品' : '修改商品'}">
                            新增商品</button>

                    </div>

                </form>

            </div>

            <!-- 下面：商品列表 -->

            <div class="product-list-box">

                <div class="section-heading">

                    <div class="section-label">
                        PRODUCT LIST
                    </div>

                    <h2>目前商品</h2>

                    <p>管理目前已建立的商品</p>

                </div>


                <div class="product-table-wrapper">

                    <table class="product-table">

                        <thead>

                            <tr>
                                <th>ID</th>
                                <th>商品名稱</th>
                                <th>分類</th>
                                <th>價格</th>
                                <th>庫存</th>
                                <th>操作</th>
                            </tr>

                        </thead>

                        <tbody>

                            <tr th:each="product : ${Products}">

                                <td th:text="${product.id}">1</td>


                                <td>
                                    <input type="text"
                                     class="edit-input" 
                                     name="name" 
                                     th:value="${product.name}" 
                                     readonly>
                                </td>

                                <td>

                                     <input type="text"
                                     class="edit-input" 
                                     name="category" 
                                     th:value="${product.category}" 
                                     readonly>
                                </td>

                                <td> 
                                    <input type="number"
                                     class="edit-input" 
                                     name="price" 
                                     th:value="${product.price}" 
                                     readonly>
                                </td>

                                <td>
                                     <input type="number"
                                     class="edit-input" 
                                     name="stock" 
                                     th:value="${product.stock}" 
                                     readonly>
                                </td>

                                <td class="product-actions">

                                    <form th:id="'editForm_' + ${product.id}"
                                            th:action="@{/products/edit}"
                                            method="post">
                                        <input type="hidden"
                                                th:name="${_csrf.parameterName}"
                                                th:value="${_csrf.token}">
                                        <input type="hidden"
                                                name="action"
                                                value="update">
                                        <input type="hidden"
                                                name="id"
                                                th:value="${product.id}">   
                                    </form>

                                    <!-- 編輯 -->
                                    <button type="button"
                                            class="action-edit"
                                            th:data-id="${product.id}"
                                            onclick="editProduct(this)">
                                        修改
                                        </button>

                                    <!-- 刪除 -->
                                    <form th:action="@{/products/edit}" method="post" class="delete-form">


                                        <!-- CSRF -->
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">


                                        <input type="hidden" name="action" value="delete">


                                        <input type="hidden" name="id" th:value="${product.id}">


                                        <button type="submit" class="action-delete"
                                            onclick="return confirm('確定要刪除此商品嗎？');">

                                            刪除

                                        </button>

                                    </form>


                                </td>

                            </tr>


                            <!-- 沒有商品 -->
                            <tr th:if="${#lists.isEmpty(Products)}">

                                <td colspan="6" class="empty-product">

                                    目前沒有商品

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>
    <!-- Footer -->
    <footer>

        <div th:replace="~{layout/footer :: footer}"></div>

    </footer>

    <!-- 修改商品 JS  --> 
     <script> 
     function editProduct(button) { 
    // 找到目前這一筆商品的 ID 
     const id = button.dataset.id; 
     // 找到這一列 
     const row = button.closest("tr");  
     //找到這一列的輸入框 
     const inputs = row.querySelectorAll(".edit-input"); 
     // 如果現在是「修改」 
     if (button.innerText === "修改") { 
    // 所有欄位解除 readonly 
    inputs.forEach(function(input) { input.removeAttribute("readonly"); }); 
    // 按鈕改成「儲存」 
    button.innerText = "儲存"; 
    // 第一個欄位自動取得焦點 
    if (inputs.length > 0) { inputs[0].focus(); } } 
    // 如果現在是「儲存」 
    else { 
    // 找到更新用的 Form 
    const form = document.getElementById( "editForm_" + id ); 
    // 把目前輸入框的值放進 Form 
    inputs.forEach(function(input) { const hiddenInput = document.createElement("input"); 
    hiddenInput.type = "hidden"; 
    hiddenInput.name = input.name; 
    hiddenInput.value = input.value; 
    form.appendChild(hiddenInput); }); 
    // 送出更新 
    form.submit(); } } 
    </script>

</body>

</html>
